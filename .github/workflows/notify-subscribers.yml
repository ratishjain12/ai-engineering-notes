name: Notify subscribers

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/**/*.md'
      - 'src/content/docs/**/*.mdx'
  schedule:
    - cron: '0 6 * * *' # picks up posts whose date has arrived
  workflow_dispatch:

concurrency: notify-subscribers

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only files *added* in a push count as new; edits to existing posts don't.
      # Scheduled/manual runs scan every dated, published post not yet sent.
      - name: Find new posts
        id: new
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "args=--scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE=${{ github.event.before }}
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
          FILES=$(git diff --diff-filter=A --name-only "$BEFORE" HEAD -- 'src/content/docs/**/*.md' 'src/content/docs/**/*.mdx' | tr '\n' ' ')
          echo "args=$FILES" >> "$GITHUB_OUTPUT"

      - name: Email subscribers
        if: steps.new.outputs.args != ''
        run: node scripts/notify.mjs ${{ steps.new.outputs.args }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
