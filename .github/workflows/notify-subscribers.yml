name: Notify subscribers

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/**/*.md'
      - 'src/content/docs/**/*.mdx'
  schedule:
    - cron: '0 6 * * *' # picks up posts whose date has arrived
  workflow_dispatch:

concurrency: notify-subscribers

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Emails every published, dated post not yet sent. Edits to old posts and drafts send nothing.
      - name: Email subscribers
        run: node scripts/notify.mjs --scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
